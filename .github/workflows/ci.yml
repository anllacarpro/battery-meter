name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift test
        run: swift test

  build-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build app bundle
        run: bash scripts/bundle.sh

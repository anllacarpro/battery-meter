name: Release

on:
  push:
    tags:
      - "v*"
  # Called by release-please.yml: tags created with GITHUB_TOKEN don't trigger the push event.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example v0.2.0
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "$TAG" > VERSION

      - name: Build release zip
        run: bash scripts/release.sh "${{ steps.version.outputs.tag }}"

      - name: Compute checksum
        id: checksum
        run: |
          SHA="$(shasum -a 256 dist/Battery-Meter-*.zip | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release asset sha256: $SHA"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/Battery-Meter-*.zip
          # release-please already wrote the notes for releases it creates.
          generate_release_notes: ${{ inputs.tag == '' }}

  bump-homebrew-cask:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update cask and VERSION
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          test -f Casks/battery-meter.rb || {
            echo "Casks/battery-meter.rb missing on main — merge the Homebrew PR before tagging releases." >&2
            exit 1
          }
          perl -i -pe 's/^  version ".*"/  version "$ENV{VERSION}"/' Casks/battery-meter.rb
          perl -i -pe 's/^  sha256 ".*"/  sha256 "$ENV{SHA256}"/' Casks/battery-meter.rb
          echo "$VERSION" > VERSION

      - name: Open PR with cask checksum
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(homebrew): bump cask to v${{ needs.release.outputs.version }}"
          branch: automation/bump-cask-v${{ needs.release.outputs.version }}
          delete-branch: true
          title: "chore(homebrew): bump cask to v${{ needs.release.outputs.version }}"
          body: |
            Automated update after GitHub release **v${{ needs.release.outputs.version }}**.

            - `Casks/battery-meter.rb` `sha256` matches the CI-built release zip.
            - [`VERSION`](VERSION) synced to `${{ needs.release.outputs.version }}`.

            Merge this PR so `brew install --cask battery-meter` verifies the download.
